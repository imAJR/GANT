name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main  # أو استبدله بكلمة master حسب اسم الفرع الرئيسي لديك

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # إذا كان مشروعك يحتاج إلى أمر بناء (Build)، قم بإلغاء علامة التعليق عن الأسطر أدناه
      # - name: Install Dependencies and Build
      #   run: npm install && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GANT_PROJECT_MANAGER }}
          channelId: live
          projectId: gant-project-manager
